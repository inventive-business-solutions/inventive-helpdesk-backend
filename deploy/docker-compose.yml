# Long-running services use `restart_policy: condition: any`, NOT the `on-failure` that
# frappe_docker's example ships with. `on-failure` restarts only on a NON-ZERO exit, and a
# process that shuts down politely on SIGTERM exits 0 — so Swarm records the task as
# `complete`, decides it finished successfully, and never starts another one. The service
# sits at 0/1 indefinitely and reports no error anywhere.
#
# That took production down on 2026-07-23. A restart sent SIGTERM to `backend`, gunicorn
# logged "Handling signal: term / Shutting down: Master" and exited 0, and Swarm left it
# stopped. nginx then crash-looped on `host not found in upstream "backend:8000"`, Traefik
# dropped the router for having no healthy task, and every request returned 404. Restarting
# individual services could not fix it, because Swarm did not believe anything was wrong;
# only scaling to 0 and back forced a new task.
#
# `any` is Docker's own default for long-running services and is what these should always
# have been. The one-shot jobs below (migration, clear-cache, configurator, create-site,
# backup-sites) deliberately keep `condition: none` — they are meant to run once and stop.
x-custom-image: &custom_image
  image: ${IMAGE_NAME:?No image set}:${VERSION:?No version set}

services:
  backend:
    <<: *custom_image
    environment:
      # Lets gunicorn trust the X-Forwarded-* headers nginx sends it, which is what
      # gives the session cookie its Secure flag.
      #
      # The chain is Traefik --https--> nginx --http--> gunicorn --> Frappe. Frappe
      # sets the flag from one expression (frappe/auth.py):
      #     secure = frappe.local.request.scheme == "https"
      # and there is no config option to force it. So request.scheme has to be right.
      #
      # nginx already cooperates: /etc/nginx/conf.d/frappe.conf maps
      # $http_x_forwarded_proto through, preserving Traefik's "https" rather than
      # overwriting it with $scheme. But gunicorn only honours X-Forwarded-* from
      # peers listed in forwarded_allow_ips, which defaults to 127.0.0.1 — and on
      # Swarm nginx reaches this container from an overlay address (10.0.x.x), so
      # gunicorn discarded the header and reported the scheme as plain http.
      #
      # "*" is safe here: this service publishes no ports and is reachable only on
      # the internal overlay networks below, so nothing outside the stack can reach
      # gunicorn to spoof the header.
      #
      # NB: USE_PROXY (Frappe's own ProxyFix switch) does NOT work here. It is only
      # applied inside frappe/app.py's serve(), the `bench serve` dev server; gunicorn
      # imports frappe.app:application directly and never runs that code path.
      FORWARDED_ALLOW_IPS: "*"
    deploy:
      restart_policy:
        condition: any
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    networks:
      - mariadb-network
      - bench-network
    healthcheck:
      test: ["CMD", "wait-for-it", "0.0.0.0:8000"]
      interval: 2s
      timeout: 10s
      retries: 30

  frontend:
    <<: *custom_image
    command:
      - nginx-entrypoint.sh
    deploy:
      restart_policy:
        condition: any
      labels:
        - traefik.enable=true
        - traefik.swarm.network=traefik-public
        - traefik.constraint-label=traefik-public
        - traefik.http.middlewares.${BENCH_NAME:-inventive_helpdesk_bench}-redirect.redirectscheme.scheme=https
        - traefik.http.routers.${BENCH_NAME:-inventive_helpdesk_bench}-http.rule=Host(${SITES:?No sites set})
        - traefik.http.routers.${BENCH_NAME:-inventive_helpdesk_bench}-http.entrypoints=web
        - traefik.http.routers.${BENCH_NAME:-inventive_helpdesk_bench}-http.middlewares=${BENCH_NAME:-inventive_helpdesk_bench}-redirect
        - traefik.http.routers.${BENCH_NAME:-inventive_helpdesk_bench}-https.rule=Host(${SITES})
        - traefik.http.routers.${BENCH_NAME:-inventive_helpdesk_bench}-https.entrypoints=websecure
        - traefik.http.routers.${BENCH_NAME:-inventive_helpdesk_bench}-https.tls=true
        - traefik.http.routers.${BENCH_NAME:-inventive_helpdesk_bench}-https.tls.certresolver=le
        - traefik.http.services.${BENCH_NAME:-inventive_helpdesk_bench}.loadbalancer.server.port=8080
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: $$host
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-1024m}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    networks:
      - bench-network
      - traefik-public
    healthcheck:
      test: ["CMD", "wait-for-it", "0.0.0.0:8080"]
      interval: 2s
      timeout: 30s
      retries: 30

  queue-default:
    <<: *custom_image
    deploy:
      restart_policy:
        condition: any
    command: bench worker --queue default
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    networks:
      - mariadb-network
      - bench-network
    healthcheck:
      test: ["CMD", "wait-for-it", "redis-queue:6379"]
      interval: 2s
      timeout: 10s
      retries: 30

  queue-long:
    <<: *custom_image
    deploy:
      restart_policy:
        condition: any
    command: bench worker --queue long,default,short
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    networks:
      - mariadb-network
      - bench-network
    healthcheck:
      test: ["CMD", "wait-for-it", "redis-queue:6379"]
      interval: 2s
      timeout: 10s
      retries: 30

  queue-short:
    <<: *custom_image
    deploy:
      restart_policy:
        condition: any
    command: bench worker --queue short,default
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    networks:
      - mariadb-network
      - bench-network
    healthcheck:
      test: ["CMD", "wait-for-it", "redis-queue:6379"]
      interval: 2s
      timeout: 10s
      retries: 30

  scheduler:
    <<: *custom_image
    deploy:
      restart_policy:
        condition: any
    command: bench schedule
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    networks:
      - mariadb-network
      - bench-network
    healthcheck:
      test: ["CMD", "wait-for-it", "redis-queue:6379"]
      interval: 2s
      timeout: 10s
      retries: 30

  websocket:
    <<: *custom_image
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    deploy:
      restart_policy:
        condition: any
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    networks:
      - mariadb-network
      - bench-network
    healthcheck:
      test: ["CMD", "wait-for-it", "0.0.0.0:9000"]
      interval: 2s
      timeout: 10s
      retries: 30

  migration:
    <<: *custom_image
    deploy:
      mode: replicated
      replicas: ${MIGRATE:-1}
      restart_policy:
        condition: none
    entrypoint: ["bash", "-c"]
    command:
      - |
        bench --site all set-config -p maintenance_mode 1
        bench --site all set-config -p pause_scheduler 1
        bench --site all migrate
        bench --site all set-config -g chromium_path /usr/bin/chromium-headless-shell
        bench --site all set-config -p maintenance_mode 0
        bench --site all set-config -p pause_scheduler 0
        # `bench migrate` DOES clear the asset cache — but in Migrate.setUp(), i.e. before
        # any of the above runs. At that point the OLD backend tasks are still serving, and
        # any request they handle regenerates the shared `assets_json` key in redis-cache
        # from the OLD image's sites/assets/assets.json. The new tasks then boot and read
        # that stale value, so every page renders <link>/<script> tags pointing at asset
        # hashes that no longer exist on disk — 404s, and an unstyled desk.
        #
        # redis-cache has no volume, but it is a long-running service that is NOT recreated
        # during a rolling update, so the poisoned key survives the whole deploy.
        #
        # Hit production on 2026-07-23: login.bundle.DZBBLCJA.css (stale, 404) was served
        # while login.bundle.WVDSPPAN.css (real) sat on disk. It only shows up when a
        # request lands mid-migration, and it only breaks the bundles whose content
        # actually changed — a bundle that hashed the same looks fine, which makes it
        # read as "only CSS is broken".
        #
        # So clear it again at the END, once the rollout has had time to finish. The sleep
        # is a timer, not a real barrier — CI also fires a `clear-cache` webhook after its
        # Verify Deployment step, which is the exact-ordering half of this fix. Either one
        # alone closes the common case; both together cover manual Portainer redeploys too.
        sleep 180
        bench --site all clear-cache
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    networks:
      - mariadb-network
      - bench-network

  # Clears the shared `assets_json` redis key after a rollout has completed. See the long
  # note in `migration` for why that is needed; this service is the exact-ordering half of
  # the fix, triggered by CI once Verify Deployment confirms the new build_sha is live.
  #
  # replicas is 1, not 0: a Portainer service webhook performs `docker service update
  # --force`, which only spawns a fresh task if the service is meant to have one. At 0 the
  # webhook would be accepted and silently do nothing. With `condition: none` the task runs
  # once and stops, so a completed run costs nothing until the next force-update.
  #
  # Harmless if it also runs at deploy time (the image digest changes each release, so
  # Swarm starts a task then too) — it is idempotent, takes about a second, and clearing a
  # cache mid-rollout is exactly what migrate already does.
  clear-cache:
    <<: *custom_image
    deploy:
      mode: replicated
      replicas: ${CLEAR_CACHE:-1}
      restart_policy:
        condition: none
    entrypoint: ["bash", "-c"]
    command:
      - >
        wait-for-it -t 120 $$DB_HOST:$$DB_PORT;
        wait-for-it -t 120 redis-cache:6379;
        bench --site all clear-cache
    environment:
      # Without these the `wait-for-it $$DB_HOST:$$DB_PORT` above gets a bare ":" and
      # aborts with a usage error — same trap as create-site.
      DB_HOST: ${DB_HOST:-mariadb_db}
      DB_PORT: ${DB_PORT:-3306}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    networks:
      - mariadb-network
      - bench-network

  configurator:
    <<: *custom_image
    deploy:
      mode: replicated
      replicas: ${CONFIGURE:-0}
      restart_policy:
        condition: none
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
        bench set-config -g chromium_path /usr/bin/chromium-headless-shell;
    environment:
      DB_HOST: ${DB_HOST:-mariadb_db}
      DB_PORT: ${DB_PORT:-3306}
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: 9000

  create-site:
    <<: *custom_image
    deploy:
      mode: replicated
      replicas: ${CREATE_SITE:-0}
      restart_policy:
        condition: none
    entrypoint: ["bash", "-c"]
    command:
      - >
        wait-for-it -t 120 $$DB_HOST:$$DB_PORT;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1
          fi
        done;
        echo "sites/common_site_config.json found";
        if [[ -f "sites/$${SITE_NAME}/site_config.json" ]]; then
          echo "$${SITE_NAME} already exists";
          exit 0;
        fi;
        if [[ -d "sites/$${SITE_NAME}" ]]; then
          echo "Removing partial site dir from an earlier failed create (no site_config.json)";
          rm -rf "sites/$${SITE_NAME}";
        fi;
        bench new-site --mariadb-user-host-login-scope='%' --admin-password=$${ADMIN_PASSWORD} --db-root-username=root --db-root-password=$${DB_ROOT_PASSWORD} $${INSTALL_APP_ARGS} $${SITE_NAME};
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Without these the command's `wait-for-it $$DB_HOST:$$DB_PORT` gets a bare
      # ":" and aborts with a usage error, skipping the database readiness wait.
      DB_HOST: ${DB_HOST:-mariadb_db}
      DB_PORT: ${DB_PORT:-3306}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      INSTALL_APP_ARGS: ${INSTALL_APP_ARGS}
      SITE_NAME: ${SITE_NAME}
    networks:
      - bench-network
      - mariadb-network

  backup-sites:
    <<: *custom_image
    deploy:
      mode: replicated
      replicas: 0
      labels:
        - "swarm.cronjob.enable=true"
        - "swarm.cronjob.schedule=0 */6 * * *"
        - "swarm.cronjob.skip-running=false"
      restart_policy:
        condition: none
    entrypoint: ["bash", "-c"]
    command:
      - bench --site all backup
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    networks:
      - bench-network
      - mariadb-network

  redis-cache:
    # Pinned to the linux/amd64 digest of redis:7-alpine so Swarm always pulls
    # the correct architecture (a service-level `platform:` key is rejected by
    # docker stack deploy: "Additional property platform is not allowed").
    image: redis:7-alpine@sha256:b1addbe72465a718643cff9e60a58e6df1841e29d6d7d60c9a85d8d72f08d1a7
    deploy:
      restart_policy:
        condition: any
    networks:
      - bench-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3

  redis-queue:
    # Pinned to the linux/amd64 digest of redis:7-alpine so Swarm always pulls
    # the correct architecture (a service-level `platform:` key is rejected by
    # docker stack deploy: "Additional property platform is not allowed").
    image: redis:7-alpine@sha256:b1addbe72465a718643cff9e60a58e6df1841e29d6d7d60c9a85d8d72f08d1a7
    deploy:
      restart_policy:
        condition: any
    volumes:
      - redis-queue-data:/data
    networks:
      - bench-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3

volumes:
  redis-queue-data:
  sites:

networks:
  bench-network:
    name: ${BENCH_NAME:-inventive_helpdesk_bench}
    external: false
  mariadb-network:
    name: mariadb-network
    external: true
  traefik-public:
    name: traefik-public
    external: true

# ------------------------+--------------------------------------+---------
# Env Variables           | Description                          | Default
# ------------------------+--------------------------------------+---------
# ADMIN_PASSWORD          | Admin password for new site           | nil
# BENCH_NAME              | Name of the bench network             | inventive_helpdesk_bench
# CLEAR_CACHE             | Run the post-rollout cache clear      | 1
# CLIENT_MAX_BODY_SIZE    | Nginx max upload size                 | 1024m
# CONFIGURE               | Re-generate common_site_config.json   | 0
# CREATE_SITE             | Enable site creation on deploy        | 0
# DB_HOST                 | MariaDB host                          | mariadb_db
# DB_PORT                 | MariaDB port                          | 3306
# DB_ROOT_PASSWORD        | MariaDB root password                 | nil
# IMAGE_NAME              | Container image to use                | nil
# INSTALL_APP_ARGS        | bench install-app args                | nil
# MIGRATE                 | Enable migration on deploy            | 1
# SITES                   | Backtick-quoted site domains          | nil
#                         | e.g. `site.domain.com`                |
# SITE_NAME               | Frappe site domain (create-site)      | nil
# VERSION                 | Mandatory image tag to use            | nil
# ------------------------+--------------------------------------+---------
