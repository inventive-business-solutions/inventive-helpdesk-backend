x-custom-image: &custom_image
  image: ${IMAGE_NAME:?No image set}:${VERSION:?No version set}

services:
  backend:
    <<: *custom_image
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    networks:
      - mariadb-network
      - bench-network
    healthcheck:
      test: ["CMD", "wait-for-it", "0.0.0.0:8000"]
      interval: 2s
      timeout: 10s
      retries: 30

  frontend:
    <<: *custom_image
    command:
      - nginx-entrypoint.sh
    deploy:
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.swarm.network=traefik-public
        - traefik.constraint-label=traefik-public
        - traefik.http.middlewares.${BENCH_NAME:-inventive_helpdesk_bench}-redirect.redirectscheme.scheme=https
        - traefik.http.routers.${BENCH_NAME:-inventive_helpdesk_bench}-http.rule=Host(${SITES:?No sites set})
        - traefik.http.routers.${BENCH_NAME:-inventive_helpdesk_bench}-http.entrypoints=web
        - traefik.http.routers.${BENCH_NAME:-inventive_helpdesk_bench}-http.middlewares=${BENCH_NAME:-inventive_helpdesk_bench}-redirect
        - traefik.http.routers.${BENCH_NAME:-inventive_helpdesk_bench}-https.rule=Host(${SITES})
        - traefik.http.routers.${BENCH_NAME:-inventive_helpdesk_bench}-https.entrypoints=websecure
        - traefik.http.routers.${BENCH_NAME:-inventive_helpdesk_bench}-https.tls=true
        - traefik.http.routers.${BENCH_NAME:-inventive_helpdesk_bench}-https.tls.certresolver=le
        - traefik.http.services.${BENCH_NAME:-inventive_helpdesk_bench}.loadbalancer.server.port=8080
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: $$host
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-1024m}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    networks:
      - bench-network
      - traefik-public
    healthcheck:
      test: ["CMD", "wait-for-it", "0.0.0.0:8080"]
      interval: 2s
      timeout: 30s
      retries: 30

  queue-default:
    <<: *custom_image
    deploy:
      restart_policy:
        condition: on-failure
    command: bench worker --queue default
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    networks:
      - mariadb-network
      - bench-network
    healthcheck:
      test: ["CMD", "wait-for-it", "redis-queue:6379"]
      interval: 2s
      timeout: 10s
      retries: 30

  queue-long:
    <<: *custom_image
    deploy:
      restart_policy:
        condition: on-failure
    command: bench worker --queue long,default,short
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    networks:
      - mariadb-network
      - bench-network
    healthcheck:
      test: ["CMD", "wait-for-it", "redis-queue:6379"]
      interval: 2s
      timeout: 10s
      retries: 30

  queue-short:
    <<: *custom_image
    deploy:
      restart_policy:
        condition: on-failure
    command: bench worker --queue short,default
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    networks:
      - mariadb-network
      - bench-network
    healthcheck:
      test: ["CMD", "wait-for-it", "redis-queue:6379"]
      interval: 2s
      timeout: 10s
      retries: 30

  scheduler:
    <<: *custom_image
    deploy:
      restart_policy:
        condition: on-failure
    command: bench schedule
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    networks:
      - mariadb-network
      - bench-network
    healthcheck:
      test: ["CMD", "wait-for-it", "redis-queue:6379"]
      interval: 2s
      timeout: 10s
      retries: 30

  websocket:
    <<: *custom_image
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    networks:
      - mariadb-network
      - bench-network
    healthcheck:
      test: ["CMD", "wait-for-it", "0.0.0.0:9000"]
      interval: 2s
      timeout: 10s
      retries: 30

  migration:
    <<: *custom_image
    deploy:
      mode: replicated
      replicas: ${MIGRATE:-1}
      restart_policy:
        condition: none
    entrypoint: ["bash", "-c"]
    command:
      - |
        bench --site all set-config -p maintenance_mode 1
        bench --site all set-config -p pause_scheduler 1
        bench --site all migrate
        bench --site all set-config -g chromium_path /usr/bin/chromium-headless-shell
        bench --site all set-config -p maintenance_mode 0
        bench --site all set-config -p pause_scheduler 0
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    networks:
      - mariadb-network
      - bench-network

  configurator:
    <<: *custom_image
    deploy:
      mode: replicated
      replicas: ${CONFIGURE:-0}
      restart_policy:
        condition: none
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
        bench set-config -g chromium_path /usr/bin/chromium-headless-shell;
    environment:
      DB_HOST: ${DB_HOST:-mariadb_db}
      DB_PORT: ${DB_PORT:-3306}
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: 9000

  create-site:
    <<: *custom_image
    deploy:
      mode: replicated
      replicas: ${CREATE_SITE:-0}
      restart_policy:
        condition: none
    entrypoint: ["bash", "-c"]
    command:
      - >
        wait-for-it -t 120 $$DB_HOST:$$DB_PORT;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1
          fi
        done;
        echo "sites/common_site_config.json found";
        [[ -d "sites/$${SITE_NAME}" ]] && echo "$${SITE_NAME} already exists" && exit 0;
        bench new-site --mariadb-user-host-login-scope='%' --admin-password=$${ADMIN_PASSWORD} --db-root-username=root --db-root-password=$${DB_ROOT_PASSWORD} $${INSTALL_APP_ARGS} $${SITE_NAME};
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Without these the command's `wait-for-it $$DB_HOST:$$DB_PORT` gets a bare
      # ":" and aborts with a usage error, skipping the database readiness wait.
      DB_HOST: ${DB_HOST:-mariadb_db}
      DB_PORT: ${DB_PORT:-3306}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      INSTALL_APP_ARGS: ${INSTALL_APP_ARGS}
      SITE_NAME: ${SITE_NAME}
    networks:
      - bench-network
      - mariadb-network

  backup-sites:
    <<: *custom_image
    deploy:
      mode: replicated
      replicas: 0
      labels:
        - "swarm.cronjob.enable=true"
        - "swarm.cronjob.schedule=0 */6 * * *"
        - "swarm.cronjob.skip-running=false"
      restart_policy:
        condition: none
    entrypoint: ["bash", "-c"]
    command:
      - bench --site all backup
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    networks:
      - bench-network
      - mariadb-network

  redis-cache:
    # Pinned to the linux/amd64 digest of redis:7-alpine so Swarm always pulls
    # the correct architecture (a service-level `platform:` key is rejected by
    # docker stack deploy: "Additional property platform is not allowed").
    image: redis:7-alpine@sha256:b1addbe72465a718643cff9e60a58e6df1841e29d6d7d60c9a85d8d72f08d1a7
    deploy:
      restart_policy:
        condition: on-failure
    networks:
      - bench-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3

  redis-queue:
    # Pinned to the linux/amd64 digest of redis:7-alpine so Swarm always pulls
    # the correct architecture (a service-level `platform:` key is rejected by
    # docker stack deploy: "Additional property platform is not allowed").
    image: redis:7-alpine@sha256:b1addbe72465a718643cff9e60a58e6df1841e29d6d7d60c9a85d8d72f08d1a7
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - redis-queue-data:/data
    networks:
      - bench-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3

volumes:
  redis-queue-data:
  sites:

networks:
  bench-network:
    name: ${BENCH_NAME:-inventive_helpdesk_bench}
    external: false
  mariadb-network:
    name: mariadb-network
    external: true
  traefik-public:
    name: traefik-public
    external: true

# ------------------------+--------------------------------------+---------
# Env Variables           | Description                          | Default
# ------------------------+--------------------------------------+---------
# ADMIN_PASSWORD          | Admin password for new site           | nil
# BENCH_NAME              | Name of the bench network             | inventive_helpdesk_bench
# CLIENT_MAX_BODY_SIZE    | Nginx max upload size                 | 1024m
# CONFIGURE               | Re-generate common_site_config.json   | 0
# CREATE_SITE             | Enable site creation on deploy        | 0
# DB_HOST                 | MariaDB host                          | mariadb_db
# DB_PORT                 | MariaDB port                          | 3306
# DB_ROOT_PASSWORD        | MariaDB root password                 | nil
# IMAGE_NAME              | Container image to use                | nil
# INSTALL_APP_ARGS        | bench install-app args                | nil
# MIGRATE                 | Enable migration on deploy            | 1
# SITES                   | Backtick-quoted site domains          | nil
#                         | e.g. `site.domain.com`                |
# SITE_NAME               | Frappe site domain (create-site)      | nil
# VERSION                 | Mandatory image tag to use            | nil
# ------------------------+--------------------------------------+---------
