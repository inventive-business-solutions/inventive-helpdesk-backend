name: INVENTIVE HELPDESK BACKEND CI/CD PIPELINE

on:
  push:
    # development builds and tests but never pushes or deploys, so a failure shows up
    # while you are still working rather than at merge time. Only master releases.
    branches: [master, development]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================
  # Build → Test → Push → Deploy
  #
  # The image is built locally first and only pushed once the app's tests have
  # passed inside it, so an untested image can never reach the registry — and
  # therefore can never be picked up by a manual redeploy in Portainer either.
  # ============================================================
  BUILD_TEST_DEPLOY:
    name: Build, Test & Deploy
    runs-on: [self-hosted, inventive-microscan]
    environment: Production

    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v6

      # Fail fast with a readable message. Without this an unset IMAGE_NAME only
      # surfaces several steps later as `invalid tag ":<sha>": invalid reference format`.
      - name: Validate required configuration
        env:
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
          SITE_NAME: ${{ vars.SITE_NAME }}
          APPS_JSON_BASE64: ${{ secrets.APPS_JSON_BASE64 }}
        run: |
          missing=""
          [ -z "$IMAGE_NAME" ]       && missing="$missing IMAGE_NAME(variable)"
          [ -z "$SITE_NAME" ]        && missing="$missing SITE_NAME(variable)"
          [ -z "$APPS_JSON_BASE64" ] && missing="$missing APPS_JSON_BASE64(secret)"
          if [ -n "$missing" ]; then
            echo "::error::Missing required config on the Production environment:$missing"
            exit 1
          fi
          echo "Configuration present."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Frappe Docker Repository
        uses: actions/checkout@v6
        with:
          repository: frappe/frappe_docker
          path: builds

      # Stamps the built commit inside the image so a deploy can be verified as
      # actually running this build rather than a cached older one.
      - name: Inject build SHA into Containerfile
        run: |
          echo "" >> builds/images/custom/Containerfile
          echo "ARG BUILD_SHA=dev" >> builds/images/custom/Containerfile
          echo 'RUN echo "${BUILD_SHA}" > /home/frappe/frappe-bench/apps/inventive_helpdesk_backend/inventive_helpdesk_backend/build_sha.txt' >> builds/images/custom/Containerfile

      # APPS_JSON_BASE64 carries a PAT, so it lives in secrets (not vars) to keep it
      # masked in run logs, and is piped via env so it is never rendered into the command.
      - name: Export apps.json from base64
        env:
          APPS_JSON_BASE64: ${{ secrets.APPS_JSON_BASE64 }}
        run: printf '%s' "$APPS_JSON_BASE64" | base64 -d > builds/apps.json

      # Built into the runner's local daemon, not pushed. The push happens after the
      # tests below, so nothing untested ever lands in the registry. Still a single
      # build — the later push step reuses this image rather than rebuilding it.
      - name: Build AMD64 Docker Image
        uses: docker/build-push-action@v7
        with:
          context: builds
          file: builds/images/custom/Containerfile
          push: false
          load: true
          tags: |
            ${{ vars.IMAGE_NAME }}:${{ github.sha }}
            ${{ vars.IMAGE_NAME }}:latest
          # Must match the Swarm node's architecture (linux/x86_64). A mismatch shows up
          # as "no suitable node (unsupported platform)" with tasks stuck pending.
          platforms: linux/amd64
          # Keeps the manifest single-platform; provenance attestations add an
          # "unknown/unknown" entry that confuses some registry/pull paths.
          provenance: false
          # Cache disabled on purpose: the GHA layer cache was reusing the
          # `bench get-app` layer, so new app commits never made it into the
          # image (while build_sha.txt still updated, masking the staleness).
          # A full rebuild is slower but guarantees the latest app code ships.
          no-cache: true
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            # Pinned to a tag, not the version-16 branch. On a branch every rebuild
            # picked up whatever the tip happened to be that day, so the framework
            # could change under production with no commit here to show for it — and
            # local benches, which are checked out at a fixed tag, would not reproduce
            # it. Bumping this is now a deliberate, reviewable change.
            #
            # Trade-off: security fixes on version-16 no longer arrive automatically.
            # Bump this line when you take one, and move the local bench to match:
            #   cd apps/frappe && git fetch --tags && git checkout v<new>
            FRAPPE_BRANCH=v16.27.1
            PYTHON_VERSION=3.14.0
            NODE_VERSION=24.1.0
            BUILD_SHA=${{ github.sha }}
          secret-files: |
            apps_json=builds/apps.json

      # ============================================================
      # Tests
      #
      # Run inside the image that was just built, so what gets verified is the exact
      # artifact that ships rather than a separately assembled bench that could drift
      # from it. MariaDB and Redis are throwaway containers on a per-run network, torn
      # down by the cleanup step below even when this fails.
      #
      # The bench setup mirrors the configurator and create-site services in
      # deploy/docker-compose.yml, so the site is built the same way as in production.
      # ============================================================
      - name: Run app tests inside the built image
        id: tests
        env:
          IMAGE_REF: ${{ vars.IMAGE_NAME }}:${{ github.sha }}
          NET: ci-${{ github.run_id }}-${{ github.run_attempt }}
          # Throwaway: this database exists only for this job and never leaves the runner.
          DB_ROOT_PASSWORD: ci-root-not-a-secret
        run: |
          set -euo pipefail

          docker network create "$NET"

          # utf8mb4/utf8mb4_unicode_ci is what Frappe requires — site creation fails on
          # a collation mismatch. skip-innodb-read-only-compressed keeps compressed
          # tables writable; it defaults off on 11.8 but is set explicitly so bumping
          # the image tag cannot silently reintroduce the problem.
          docker run -d --name "${NET}-db" --network "$NET" \
            -e MARIADB_ROOT_PASSWORD="$DB_ROOT_PASSWORD" \
            mariadb:11.8 \
            --character-set-server=utf8mb4 \
            --collation-server=utf8mb4_unicode_ci \
            --skip-character-set-client-handshake \
            --skip-innodb-read-only-compressed

          # The same digest the stack pins, so cache and queue behave identically here.
          docker run -d --name "${NET}-redis" --network "$NET" \
            redis:7-alpine@sha256:b1addbe72465a718643cff9e60a58e6df1841e29d6d7d60c9a85d8d72f08d1a7

          echo "Waiting for MariaDB to accept connections..."
          for i in $(seq 1 60); do
            if docker exec "${NET}-db" mariadb-admin ping -uroot -p"$DB_ROOT_PASSWORD" --silent >/dev/null 2>&1; then
              echo "MariaDB ready after ${i} attempt(s)."
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::MariaDB never became ready — dumping its log"
              docker logs "${NET}-db" 2>&1 | tail -40
              exit 1
            fi
            sleep 2
          done

          # Single-quoted heredoc-style body: the variables below are expanded inside the
          # container from the -e values, not by the runner's shell.
          docker run --rm --network "$NET" \
            --entrypoint bash \
            -e DB_HOST="${NET}-db" \
            -e REDIS_HOST="${NET}-redis" \
            -e DB_ROOT_PASSWORD="$DB_ROOT_PASSWORD" \
            "$IMAGE_REF" -c '
              set -eu
              cd /home/frappe/frappe-bench

              # bench reads the app list from this file; the stack writes it the same way.
              ls -1 apps > sites/apps.txt

              bench set-config -g db_host "$DB_HOST"
              bench set-config -gp db_port 3306
              bench set-config -g redis_cache "redis://$REDIS_HOST:6379"
              bench set-config -g redis_queue "redis://$REDIS_HOST:6379"
              bench set-config -g redis_socketio "redis://$REDIS_HOST:6379"

              bench new-site ci.localhost \
                --mariadb-user-host-login-scope=% \
                --db-root-username root \
                --db-root-password "$DB_ROOT_PASSWORD" \
                --admin-password ci-admin \
                --install-app inventive_helpdesk_backend

              # Frappe refuses to run tests unless the site opts in.
              bench --site ci.localhost set-config allow_tests true

              bench --site ci.localhost run-tests --app inventive_helpdesk_backend
            '

      - name: Tear down test containers
        if: always()
        env:
          NET: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker rm -f "${NET}-db" "${NET}-redis" >/dev/null 2>&1 || true
          docker network rm "$NET" >/dev/null 2>&1 || true
          echo "Test containers and network removed."

      # Only now, with the tests green, is the image allowed into the registry — and
      # only from master. A development run has done its job by this point and stops.
      - name: Push image to registry
        id: push
        if: success() && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          docker push "${{ vars.IMAGE_NAME }}:${{ github.sha }}"
          docker push "${{ vars.IMAGE_NAME }}:latest"
          echo "Pushed :${{ github.sha }} and :latest"

      # The stack's VERSION must be "latest" (not a pinned SHA). This webhook only
      # re-pulls the git repo and redeploys — it does not set environment variables,
      # and a ?VERSION= query parameter is silently ignored on Community Edition.
      # Because docker stack deploy re-resolves a tag to its current registry digest,
      # redeploying :latest picks up the image this run just pushed. Pinning VERSION
      # to a SHA makes every redeploy faithfully reinstall that same old image.
      # Each build is also tagged :<sha>, so rollback is still a VERSION change.
      - name: Deploy to Server
        id: deploy
        if: success() && steps.push.outcome == 'success'
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::notice::PORTAINER_WEBHOOK_URL not set — skipping deploy. Release manually in Portainer."
            exit 0
          fi
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$WEBHOOK_URL")
          echo "status_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          if [ "$HTTP_CODE" -ne 204 ] && [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Deployment webhook failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Deployment triggered (HTTP $HTTP_CODE)"

      # Compares the running container's stamped build_sha against this commit. A plain
      # HTTP 200 check would pass against the previous container still serving traffic.
      - name: Verify Deployment
        id: verify
        if: steps.deploy.outcome == 'success'
        run: |
          EXPECTED_SHA="${{ github.sha }}"
          HEALTH_URL="https://${{ vars.SITE_NAME }}/api/method/inventive_helpdesk_backend.health.check"
          echo "Waiting for container restart..."
          sleep 60

          MAX_ATTEMPTS=12
          WAIT_SECONDS=15

          for i in $(seq 1 $MAX_ATTEMPTS); do
            RESPONSE=$(curl -s --max-time 10 "$HEALTH_URL" || true)
            DEPLOYED_SHA=$(echo "$RESPONSE" | jq -r '.message.build_sha // empty' 2>/dev/null || true)

            if [ "$DEPLOYED_SHA" = "$EXPECTED_SHA" ]; then
              echo "Deployment verified — running build $DEPLOYED_SHA"
              echo "status=healthy" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Attempt $i/$MAX_ATTEMPTS — deployed: ${DEPLOYED_SHA:-unavailable}, expected: $EXPECTED_SHA. Retrying in ${WAIT_SECONDS}s..."
            sleep $WAIT_SECONDS
          done

          echo "::error::Verification failed — $EXPECTED_SHA not live after $MAX_ATTEMPTS attempts"
          echo "status=unhealthy" >> "$GITHUB_OUTPUT"
          exit 1

      # The build is loaded into this runner's local daemon rather than pushed straight
      # out, and the runner is long-lived — without this every run strands a full image
      # and the disk fills. Safe to drop: the deploy pulls from the registry, and
      # no-cache is on anyway, so nothing here would have been reused.
      - name: Remove locally built image
        if: always()
        run: |
          docker rmi -f "${{ vars.IMAGE_NAME }}:${{ github.sha }}" >/dev/null 2>&1 || true
          docker rmi -f "${{ vars.IMAGE_NAME }}:latest" >/dev/null 2>&1 || true
          echo "Local image tags removed from the runner."

      - name: Deployment Summary
        if: always()
        run: |
          echo "## Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Detail | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Environment** | Production |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Image** | \`${{ vars.IMAGE_NAME }}:${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Platform** | \`linux/amd64\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | [\`${GITHUB_SHA::7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          case "${{ steps.tests.outcome }}" in
            success) echo "| **Tests** | Passed |" >> "$GITHUB_STEP_SUMMARY" ;;
            skipped) echo "| **Tests** | Skipped |" >> "$GITHUB_STEP_SUMMARY" ;;
            *)       echo "| **Tests** | Failed — nothing pushed or deployed |" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          case "${{ steps.push.outcome }}" in
            success) echo "| **Registry push** | Pushed \`:${GITHUB_SHA::7}\` and \`:latest\` |" >> "$GITHUB_STEP_SUMMARY" ;;
            skipped) echo "| **Registry push** | Skipped (not master) |" >> "$GITHUB_STEP_SUMMARY" ;;
            *)       echo "| **Registry push** | Failed |" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          case "${{ steps.deploy.outcome }}" in
            success) echo "| **Webhook** | Triggered |" >> "$GITHUB_STEP_SUMMARY" ;;
            skipped) echo "| **Webhook** | Skipped |" >> "$GITHUB_STEP_SUMMARY" ;;
            *)       echo "| **Webhook** | Failed |" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          if [ "${{ steps.verify.outcome }}" == "success" ]; then
            echo "| **Health Check** | Healthy |" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.verify.outcome }}" == "skipped" ]; then
            echo "| **Health Check** | Skipped |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| **Health Check** | Unhealthy |" >> "$GITHUB_STEP_SUMMARY"
          fi
