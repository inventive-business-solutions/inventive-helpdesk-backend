name: INVENTIVE HELPDESK BACKEND CI/CD PIPELINE

on:
  push:
    # development builds and tests but never pushes or deploys, so a failure shows up
    # while you are still working rather than at merge time. Only master releases.
    branches: [master, development]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================
  # Build → Test → Push → Deploy
  #
  # The image is built locally first and only pushed once the app's tests have
  # passed inside it, so an untested image can never reach the registry — and
  # therefore can never be picked up by a manual redeploy in Portainer either.
  # ============================================================
  BUILD_TEST_DEPLOY:
    name: Build, Test & Deploy
    runs-on: [self-hosted, inventive-microscan]
    environment: Production

    steps:
      # BEFORE checkout, deliberately.
      #
      # This is a self-hosted runner, so the workspace persists between runs and whatever
      # the last one left is still there. Any step that bind-mounts it into a container
      # writes as root — the lint step did exactly that, leaving a root-owned .ruff_cache
      # behind. actions/checkout wipes the workspace before cloning and runs as `ubuntu`,
      # so it could not remove that file and aborted:
      #
      #     EACCES: permission denied, unlink '.../.ruff_cache/.gitignore'
      #
      # Every subsequent run then failed at step one, naming a cache file rather than the
      # cause — and no fix committed to this workflow could take effect, because checkout
      # died before reaching it. A root container is the only thing on the runner able to
      # delete what a root container created, which is why this runs in one.
      #
      # `|| true`: a workspace that does not exist yet (a fresh runner, or the very first
      # run for this repo) is the normal case, not a failure.
      - name: Clear root-owned leftovers from the workspace
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/ws" alpine:3 \
            sh -c 'rm -rf /ws/.ruff_cache /ws/.pytest_cache /ws/.mypy_cache' || true

      - name: Checkout Main Repository
        uses: actions/checkout@v6

      # Fail fast with a readable message. Without this an unset IMAGE_NAME only
      # surfaces several steps later as `invalid tag ":<sha>": invalid reference format`.
      - name: Validate required configuration
        env:
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
          SITE_NAME: ${{ vars.SITE_NAME }}
          APPS_JSON_BASE64: ${{ secrets.APPS_JSON_BASE64 }}
        run: |
          missing=""
          [ -z "$IMAGE_NAME" ]       && missing="$missing IMAGE_NAME(variable)"
          [ -z "$SITE_NAME" ]        && missing="$missing SITE_NAME(variable)"
          [ -z "$APPS_JSON_BASE64" ] && missing="$missing APPS_JSON_BASE64(secret)"
          if [ -n "$missing" ]; then
            echo "::error::Missing required config on the Production environment:$missing"
            exit 1
          fi
          echo "Configuration present."

      # Lint BEFORE the image build. ruff takes seconds and the build takes minutes, so a
      # style failure has no business waiting behind it — this mirrors the frontend
      # pipeline, which gates lint, format and typecheck ahead of its build.
      #
      # This step did not exist, and the effect was one-sided drift: ruff was configured in
      # pyproject.toml and .pre-commit-config.yaml, but CI ran only tests and pre-commit is
      # not installed on every clone, so nothing actually enforced it. Three violations had
      # accumulated by the time anyone ran it by hand.
      #
      # Pinned to the SAME version as .pre-commit-config.yaml. If the two drift apart then
      # CI and the local hook disagree about identical code, and whichever a developer
      # trusts is the wrong one. Run through a container rather than a runner-installed
      # ruff for the same reason: the version is then a property of this file, not of
      # whatever happens to be on the box.
      - name: Lint (ruff)
        env:
          RUFF_VERSION: "0.15.22"
        run: |
          set -euo pipefail
          # --no-cache is the whole fix. ruff writes .ruff_cache into its working
          # directory, which is the MOUNTED workspace; the container runs as root, so that
          # directory landed on the runner owned by root and the next actions/checkout —
          # running as `ubuntu` — could not delete it. Every later build then died at
          # checkout with EACCES, before reaching a line of our code.
          #
          # Running the container as --user looked like the tidier fix and was not: pip
          # then cannot write to the system site-packages, silently falls back to a user
          # install under $HOME/.local/bin, and that is not on PATH — so the step failed
          # with `ruff: not found`. This is back to the invocation that ran green for
          # every build before the cache problem, with only the cache turned off.
          #
          # The pre-checkout cleanup step above is the backstop for anything else a
          # containerised tool leaves behind.
          docker run --rm -v "$PWD:/io" -w /io python:3-slim sh -c "
            pip install --quiet --no-cache-dir ruff==${RUFF_VERSION} &&
            ruff check --no-cache --output-format=github inventive_helpdesk_backend
          "

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Frappe Docker Repository
        uses: actions/checkout@v6
        with:
          repository: frappe/frappe_docker
          path: builds

      # Stamps the built commit inside the image so a deploy can be verified as
      # actually running this build rather than a cached older one.
      - name: Inject build SHA into Containerfile
        run: |
          echo "" >> builds/images/custom/Containerfile
          echo "ARG BUILD_SHA=dev" >> builds/images/custom/Containerfile
          echo 'RUN echo "${BUILD_SHA}" > /home/frappe/frappe-bench/apps/inventive_helpdesk_backend/inventive_helpdesk_backend/build_sha.txt' >> builds/images/custom/Containerfile

      # APPS_JSON_BASE64 carries a PAT, so it lives in secrets (not vars) to keep it
      # masked in run logs, and is piped via env so it is never rendered into the command.
      - name: Export apps.json from base64
        env:
          APPS_JSON_BASE64: ${{ secrets.APPS_JSON_BASE64 }}
        run: printf '%s' "$APPS_JSON_BASE64" | base64 -d > builds/apps.json

      # apps.json pins a BRANCH, and `bench get-app` clones that branch — not the commit
      # this run is building. So a push to development cloned whatever branch the secret
      # names, tested THAT, and reported success: every green check on development was
      # testing different code from the code that was pushed.
      #
      # Found on 2026-07-22 the expensive way. Commit 56563fe passed on development and
      # then failed on master with two genuine test failures, after master had already been
      # pushed — leaving the frontend deployed against a backend that never moved.
      #
      # Rewritten in place so the app under test is the branch actually being built. The
      # URL carries the PAT, so only branch names are ever printed.
      - name: Point apps.json at the branch being built
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          jq --arg ref "$REF_NAME" '
            map(if (.url | test("inventive-helpdesk-backend")) then .branch = $ref else . end)
          ' builds/apps.json > builds/apps.json.tmp
          mv builds/apps.json.tmp builds/apps.json
          echo "Branches to be cloned: $(jq -r '[.[].branch] | join(", ")' builds/apps.json)"

      # Built into the runner's local daemon, not pushed. The push happens after the
      # tests below, so nothing untested ever lands in the registry. Still a single
      # build — the later push step reuses this image rather than rebuilding it.
      - name: Build AMD64 Docker Image
        uses: docker/build-push-action@v7
        with:
          context: builds
          file: builds/images/custom/Containerfile
          push: false
          load: true
          tags: |
            ${{ vars.IMAGE_NAME }}:${{ github.sha }}
            ${{ vars.IMAGE_NAME }}:latest
          # Must match the Swarm node's architecture (linux/x86_64). A mismatch shows up
          # as "no suitable node (unsupported platform)" with tasks stuck pending.
          platforms: linux/amd64
          # Keeps the manifest single-platform; provenance attestations add an
          # "unknown/unknown" entry that confuses some registry/pull paths.
          provenance: false
          # Cache re-enabled, but ONLY for the layers that are safe to reuse.
          #
          # It was disabled because the layer cache reused `bench init`/get-app, so new app
          # commits never reached the image while build_sha.txt still updated — staleness
          # with a correct-looking stamp. `no-cache: true` fixed that by rebuilding
          # everything, which meant re-installing apt packages, Node and Chromium on every
          # run: ~260s, of which the app fetch is a small fraction.
          #
          # frappe_docker declares `ARG CACHE_BUST` immediately before that RUN and
          # references it as `: "${CACHE_BUST}"` (images/custom/Containerfile), purely so
          # the value participates in the layer's cache key. Feeding it the commit SHA
          # invalidates the app layer on every commit while the `base` stage above it — the
          # expensive one — stays cached.
          #
          # NO registry cache. Tried on 2026-07-27 and measured a regression:
          #
          #     ~250s   before (no-cache: true, nothing reused)
          #      305s   with cache-to/from registry, on a real commit
          #       99s   with cache, RE-RUNNING THE SAME COMMIT  <- not a valid comparison
          #
          # The 99s is the trap. A re-run has the same github.sha, so CACHE_BUST is
          # unchanged and the bench-init layer is cached too — which never happens for a
          # real commit. Judged on that number the cache looked like a 60% win; on actual
          # commits it is slower, because bench init (clone frappe, yarn, build assets) is
          # precisely the layer CACHE_BUST must rebuild, and the base stage it can reuse is
          # worth less than shipping the layers to and from GHCR costs.
          #
          # What IS kept is the runner's LOCAL layer cache — no network, and the frontend
          # measured local as much faster than registry. `no-cache: true` used to be here
          # because the local cache reused `bench get-app` and shipped stale app code under
          # a correct build_sha. CACHE_BUST fixes that at the source: the app layer's key
          # now changes every commit, so it cannot be reused.
          #
          # The guarantee does not rest on that reasoning being right. "Verify the image
          # contains this commit's app code" below hashes every .py/.json in the app on the
          # workspace and inside the image and refuses to continue if they differ — so if
          # the app layer were ever wrongly reused, the build fails loudly rather than
          # shipping stale code. That check is what makes dropping no-cache safe to try.
          build-args: |
            # Changes every commit, so the app-install layer is never reused. See above.
            CACHE_BUST=${{ github.sha }}
            FRAPPE_PATH=https://github.com/frappe/frappe
            # Pinned to a tag, not the version-16 branch. On a branch every rebuild
            # picked up whatever the tip happened to be that day, so the framework
            # could change under production with no commit here to show for it — and
            # local benches, which are checked out at a fixed tag, would not reproduce
            # it. Bumping this is now a deliberate, reviewable change.
            #
            # Trade-off: security fixes on version-16 no longer arrive automatically.
            # Bump this line when you take one, and move the local bench to match:
            #   cd apps/frappe && git fetch --tags && git checkout v<new>
            FRAPPE_BRANCH=v16.27.1
            PYTHON_VERSION=3.14.0
            NODE_VERSION=24.1.0
            BUILD_SHA=${{ github.sha }}
          secret-files: |
            apps_json=builds/apps.json

      # The branch rewrite above is the fix; this is the alarm that proves it worked. It has
      # to exist independently, because build_sha.txt is written from github.sha and so is
      # incapable of detecting an image built from different source — that is precisely why
      # the staleness stayed invisible for as long as it did.
      #
      # Compared by file CONTENT, not by commit: frappe_docker deletes .git from every app
      # (images/custom/Containerfile:144), so there is no revision left in the image to read.
      # build_sha.txt is excluded because the build writes it into this same directory.
      - name: Verify the image contains this commit's app code
        env:
          IMAGE_REF: ${{ vars.IMAGE_NAME }}:${{ github.sha }}
        run: |
          set -euo pipefail
          HASH_CMD='find . -type f \( -name "*.py" -o -name "*.json" \) ! -path "*/__pycache__/*" ! -name "build_sha.txt" | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -d" " -f1'

          EXPECTED=$(cd inventive_helpdesk_backend && eval "$HASH_CMD")
          ACTUAL=$(docker run --rm --entrypoint bash "$IMAGE_REF" -c \
            "cd /home/frappe/frappe-bench/apps/inventive_helpdesk_backend/inventive_helpdesk_backend && $HASH_CMD")

          echo "workspace : $EXPECTED"
          echo "image     : $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Image was built from different app code than this commit. The tests below would have verified the wrong thing — refusing to continue."
            exit 1
          fi
          echo "Image matches this commit's app code."

      # ============================================================
      # Tests
      #
      # Run inside the image that was just built, so what gets verified is the exact
      # artifact that ships rather than a separately assembled bench that could drift
      # from it. MariaDB and Redis are throwaway containers on a per-run network, torn
      # down by the cleanup step below even when this fails.
      #
      # The bench setup mirrors the configurator and create-site services in
      # deploy/docker-compose.yml, so the site is built the same way as in production.
      # ============================================================
      - name: Run app tests inside the built image
        id: tests
        env:
          IMAGE_REF: ${{ vars.IMAGE_NAME }}:${{ github.sha }}
          NET: ci-${{ github.run_id }}-${{ github.run_attempt }}
          # Throwaway: this database exists only for this job and never leaves the runner.
          DB_ROOT_PASSWORD: ci-root-not-a-secret
        run: |
          set -euo pipefail

          docker network create "$NET"

          # utf8mb4/utf8mb4_unicode_ci is what Frappe requires — site creation fails on
          # a collation mismatch. skip-innodb-read-only-compressed keeps compressed
          # tables writable; it defaults off on 11.8 but is set explicitly so bumping
          # the image tag cannot silently reintroduce the problem.
          docker run -d --name "${NET}-db" --network "$NET" \
            -e MARIADB_ROOT_PASSWORD="$DB_ROOT_PASSWORD" \
            mariadb:11.8 \
            --character-set-server=utf8mb4 \
            --collation-server=utf8mb4_unicode_ci \
            --skip-character-set-client-handshake \
            --skip-innodb-read-only-compressed

          # The same digest the stack pins, so cache and queue behave identically here.
          docker run -d --name "${NET}-redis" --network "$NET" \
            redis:7-alpine@sha256:b1addbe72465a718643cff9e60a58e6df1841e29d6d7d60c9a85d8d72f08d1a7

          # Probed from ANOTHER container on the network, not with `docker exec`.
          #
          # `docker exec ... mariadb-admin ping` connects over the DB container's local
          # socket, and the official entrypoint runs initialization against a temporary
          # server started with --skip-networking before restarting the real one. So the
          # socket answers while no TCP listener exists, the probe passes in a few seconds,
          # and the app container — which connects across the network, like every real
          # client — gets nothing.
          #
          # Seen on 2026-07-27: "MariaDB ready after 3 attempt(s)" at 16:12:27, then
          # `OperationalError (2002) Can't connect to server ... (115)` five seconds later.
          # A latent race since this step was written; heavier load on the shared runner
          # widens the init window and makes it surface.
          #
          # This probe uses the same hostname, port and credentials the tests will, so
          # passing it means the thing the tests need is actually working.
          echo "Waiting for MariaDB to accept connections over the network..."
          for i in $(seq 1 60); do
            if docker run --rm --network "$NET" mariadb:11.8 \
                 mariadb-admin ping -h "${NET}-db" -uroot -p"$DB_ROOT_PASSWORD" --silent >/dev/null 2>&1; then
              echo "MariaDB reachable on the network after ${i} attempt(s)."
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::MariaDB never became ready — dumping its log"
              docker logs "${NET}-db" 2>&1 | tail -40
              exit 1
            fi
            sleep 2
          done

          # Single-quoted heredoc-style body: the variables below are expanded inside the
          # container from the -e values, not by the runner's shell.
          docker run --rm --network "$NET" \
            --entrypoint bash \
            -e DB_HOST="${NET}-db" \
            -e REDIS_HOST="${NET}-redis" \
            -e DB_ROOT_PASSWORD="$DB_ROOT_PASSWORD" \
            "$IMAGE_REF" -c '
              set -eu
              cd /home/frappe/frappe-bench

              # bench reads the app list from this file; the stack writes it the same way.
              ls -1 apps > sites/apps.txt

              bench set-config -g db_host "$DB_HOST"
              bench set-config -gp db_port 3306
              bench set-config -g redis_cache "redis://$REDIS_HOST:6379"
              bench set-config -g redis_queue "redis://$REDIS_HOST:6379"
              bench set-config -g redis_socketio "redis://$REDIS_HOST:6379"

              bench new-site ci.localhost \
                --mariadb-user-host-login-scope=% \
                --db-root-username root \
                --db-root-password "$DB_ROOT_PASSWORD" \
                --admin-password ci-admin \
                --install-app inventive_helpdesk_backend

              # Frappe refuses to run tests unless the site opts in.
              bench --site ci.localhost set-config allow_tests true

              bench --site ci.localhost run-tests --app inventive_helpdesk_backend
            '

      - name: Tear down test containers
        if: always()
        env:
          NET: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker rm -f "${NET}-db" "${NET}-redis" >/dev/null 2>&1 || true
          docker network rm "$NET" >/dev/null 2>&1 || true
          echo "Test containers and network removed."

      # Only now, with the tests green, is the image allowed into the registry — and
      # only from master. A development run has done its job by this point and stops.
      - name: Push image to registry
        id: push
        if: success() && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          docker push "${{ vars.IMAGE_NAME }}:${{ github.sha }}"
          docker push "${{ vars.IMAGE_NAME }}:latest"
          echo "Pushed :${{ github.sha }} and :latest"

      # The stack's VERSION must be "latest" (not a pinned SHA). This webhook only
      # re-pulls the git repo and redeploys — it does not set environment variables,
      # and a ?VERSION= query parameter is silently ignored on Community Edition.
      # Because docker stack deploy re-resolves a tag to its current registry digest,
      # redeploying :latest picks up the image this run just pushed. Pinning VERSION
      # to a SHA makes every redeploy faithfully reinstall that same old image.
      # Each build is also tagged :<sha>, so rollback is still a VERSION change.
      - name: Deploy to Server
        id: deploy
        if: success() && steps.push.outcome == 'success'
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::notice::PORTAINER_WEBHOOK_URL not set — skipping deploy. Release manually in Portainer."
            exit 0
          fi
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$WEBHOOK_URL")
          echo "status_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          if [ "$HTTP_CODE" -ne 204 ] && [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Deployment webhook failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Deployment triggered (HTTP $HTTP_CODE)"

      # Compares the running container's stamped build_sha against this commit. A plain
      # HTTP 200 check would pass against the previous container still serving traffic.
      - name: Verify Deployment
        id: verify
        if: steps.deploy.outcome == 'success'
        run: |
          EXPECTED_SHA="${{ github.sha }}"
          HEALTH_URL="https://${{ vars.SITE_NAME }}/api/method/inventive_helpdesk_backend.health.check"
          # Poll from the first second rather than sleeping first. `sleep 60` was a guess at
          # restart time and is paid in full on every release, even when the stack is back
          # in half that. A stale reply costs nothing here: the loop compares build_sha, so
          # the previous container answering is just a retry.
          #
          # Same worst-case budget as before (48 x 5s = 240s), spent probing instead of
          # waiting. Frappe takes longer to come up than the frontend, so the ceiling is
          # kept generous — it is the fixed floor that was wasteful, not the ceiling.
          MAX_ATTEMPTS=48
          WAIT_SECONDS=5
          echo "Polling for the new build..."

          for i in $(seq 1 $MAX_ATTEMPTS); do
            RESPONSE=$(curl -s --max-time 10 "$HEALTH_URL" || true)
            DEPLOYED_SHA=$(echo "$RESPONSE" | jq -r '.message.build_sha // empty' 2>/dev/null || true)

            if [ "$DEPLOYED_SHA" = "$EXPECTED_SHA" ]; then
              echo "Deployment verified — running build $DEPLOYED_SHA"
              echo "status=healthy" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Attempt $i/$MAX_ATTEMPTS — deployed: ${DEPLOYED_SHA:-unavailable}, expected: $EXPECTED_SHA. Retrying in ${WAIT_SECONDS}s..."
            sleep $WAIT_SECONDS
          done

          echo "::error::Verification failed — $EXPECTED_SHA not live after $MAX_ATTEMPTS attempts"
          echo "status=unhealthy" >> "$GITHUB_OUTPUT"
          exit 1

      # `bench migrate` clears the asset cache, but does it in Migrate.setUp() — before the
      # rollout finishes. Old backend tasks still serving traffic then regenerate the shared
      # `assets_json` key in redis from the OLD image, and the new tasks inherit it, so every
      # page points at asset hashes that no longer exist on disk. See the note on the
      # `migration` service in deploy/docker-compose.yml.
      #
      # This runs only after Verify Deployment confirmed the new build_sha is live, so by
      # here there is no old task left to re-poison the key. The compose file also clears on
      # a timer for redeploys that never go through this workflow; this is the exact one.
      #
      # Deliberately non-fatal: the image is already deployed and verified healthy, so a
      # missing webhook or a flaky Portainer must not turn a good release red. The compose
      # timer is the backstop, and a stale cache is a one-command fix, not an outage.
      - name: Clear stale asset cache
        if: steps.verify.outputs.status == 'healthy'
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_CLEARCACHE_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::notice::PORTAINER_CLEARCACHE_WEBHOOK_URL not set — relying on the timed clear-cache in docker-compose.yml."
            exit 0
          fi
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$WEBHOOK_URL" || echo 000)
          if [ "$HTTP_CODE" -ne 204 ] && [ "$HTTP_CODE" -ne 200 ]; then
            echo "::warning::clear-cache webhook returned HTTP $HTTP_CODE — if the desk renders unstyled, run: bench --site ${{ vars.SITE_NAME }} clear-cache"
            exit 0
          fi
          echo "Asset cache cleared (HTTP $HTTP_CODE)"

      # The build is loaded into this runner's local daemon rather than pushed straight
      # out, and the runner is long-lived — without this every run strands a full image
      # and the disk fills. Safe to drop: the deploy pulls from the registry, and
      # no-cache is on anyway, so nothing here would have been reused.
      - name: Remove locally built image
        if: always()
        run: |
          docker rmi -f "${{ vars.IMAGE_NAME }}:${{ github.sha }}" >/dev/null 2>&1 || true
          docker rmi -f "${{ vars.IMAGE_NAME }}:latest" >/dev/null 2>&1 || true
          echo "Local image tags removed from the runner."

      - name: Deployment Summary
        if: always()
        run: |
          echo "## Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Detail | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Environment** | Production |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Image** | \`${{ vars.IMAGE_NAME }}:${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Platform** | \`linux/amd64\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | [\`${GITHUB_SHA::7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          case "${{ steps.tests.outcome }}" in
            success) echo "| **Tests** | Passed |" >> "$GITHUB_STEP_SUMMARY" ;;
            skipped) echo "| **Tests** | Skipped |" >> "$GITHUB_STEP_SUMMARY" ;;
            *)       echo "| **Tests** | Failed — nothing pushed or deployed |" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          case "${{ steps.push.outcome }}" in
            success) echo "| **Registry push** | Pushed \`:${GITHUB_SHA::7}\` and \`:latest\` |" >> "$GITHUB_STEP_SUMMARY" ;;
            skipped) echo "| **Registry push** | Skipped (not master) |" >> "$GITHUB_STEP_SUMMARY" ;;
            *)       echo "| **Registry push** | Failed |" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          case "${{ steps.deploy.outcome }}" in
            success) echo "| **Webhook** | Triggered |" >> "$GITHUB_STEP_SUMMARY" ;;
            skipped) echo "| **Webhook** | Skipped |" >> "$GITHUB_STEP_SUMMARY" ;;
            *)       echo "| **Webhook** | Failed |" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          if [ "${{ steps.verify.outcome }}" == "success" ]; then
            echo "| **Health Check** | Healthy |" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.verify.outcome }}" == "skipped" ]; then
            echo "| **Health Check** | Skipped |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| **Health Check** | Unhealthy |" >> "$GITHUB_STEP_SUMMARY"
          fi
