name: INVENTIVE HELPDESK BACKEND CI PIPELINE - PROD

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  BUILD_PROD:
    runs-on: [self-hosted, dev-arm64]
    environment: Production

    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4

      # Fail fast with a readable message. Without this an unset IMAGE_NAME only
      # surfaces six steps later as `invalid tag ":<sha>": invalid reference format`,
      # and an unset APPS_JSON_BASE64 as an opaque build failure.
      - name: Validate required configuration
        env:
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
          APPS_JSON_BASE64: ${{ secrets.APPS_JSON_BASE64 }}
        run: |
          missing=""
          [ -z "$IMAGE_NAME" ]       && missing="$missing IMAGE_NAME(variable)"
          [ -z "$APPS_JSON_BASE64" ] && missing="$missing APPS_JSON_BASE64(secret)"
          if [ -n "$missing" ]; then
            echo "::error::Missing required config on the '${{ github.job }}' environment:$missing"
            echo "Set them on the GitHub environment for this job — see CICD.md."
            exit 1
          fi
          echo "Configuration present."

      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Frappe Docker Repository
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: builds

      # APPS_JSON_BASE64 carries a PAT, so it lives in secrets (not vars) to keep it
      # masked in run logs. Piped via env rather than inlined into the run script so
      # the value never appears in the rendered command.
      - name: Export apps.json from base64
        env:
          APPS_JSON_BASE64: ${{ secrets.APPS_JSON_BASE64 }}
        run: printf '%s' "$APPS_JSON_BASE64" | base64 -d > builds/apps.json

      - name: Build and Push ARM64 Docker Image
        uses: docker/build-push-action@v6
        with:
          context: builds
          file: builds/images/custom/Containerfile
          push: true
          tags: |
            ${{ vars.IMAGE_NAME }}:${{ github.sha }}
            ${{ vars.IMAGE_NAME }}:latest
          platforms: linux/arm64
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
            PYTHON_VERSION=3.14.0
            NODE_VERSION=24.1.0
          secret-files: |
            apps_json=builds/apps.json

      # No CD step: Portainer CE does not support stack webhooks (Business Edition
      # only), and its polling alternative races the image push — it triggers on the
      # git commit, so it can redeploy before the new image finishes uploading and
      # will not retry for that commit. Deploys are therefore driven from Portainer:
      # open the stack and "Update the stack" with Re-pull image. See CICD.md.
      - name: Build Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | Production |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ vars.IMAGE_NAME }}:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | [\`${GITHUB_SHA::7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Image pushed to GHCR. To release it: open the stack in Portainer and" >> $GITHUB_STEP_SUMMARY
          echo "choose **Update the stack** with *Re-pull image* enabled." >> $GITHUB_STEP_SUMMARY
